<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="bg-grad" x1="64" y1="64" x2="448" y2="448" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="50%" stop-color="#7c3aed" />
      <stop offset="100%" stop-color="#db2777" />
    </linearGradient>
    <linearGradient id="shield-grad" x1="128" y1="96" x2="384" y2="416" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="sword-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>
    <linearGradient id="ball-top" x1="160" y1="140" x2="352" y2="256" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#f43f5e" />
      <stop offset="100%" stop-color="#e11d48" />
    </linearGradient>
    <linearGradient id="ball-bottom" x1="160" y1="256" x2="352" y2="372" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#cbd5e1" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Outer Rounded Shield / Badge -->
  <rect x="24" y="24" width="464" height="464" rx="112" fill="url(#bg-grad)" />
  <rect x="36" y="36" width="440" height="440" rx="100" fill="url(#shield-grad)" stroke="url(#bg-grad)" stroke-width="4" />

  <!-- Background Tech/Data Hexagon Grid Lines -->
  <polygon points="256,110 376,178 376,334 256,402 136,334 136,178" stroke="#4338ca" stroke-width="3" stroke-dasharray="6 6" fill="none" opacity="0.6" />
  <line x1="256" y1="110" x2="256" y2="402" stroke="#4338ca" stroke-width="2" stroke-dasharray="4 4" opacity="0.4" />
  <line x1="136" y1="178" x2="376" y2="334" stroke="#4338ca" stroke-width="2" stroke-dasharray="4 4" opacity="0.4" />
  <line x1="136" y1="334" x2="376" y2="178" stroke="#4338ca" stroke-width="2" stroke-dasharray="4 4" opacity="0.4" />

  <!-- Crossed Swords in Background (Firepower & Battles) -->
  <g opacity="0.45">
    <!-- Sword 1 -->
    <line x1="140" y1="140" x2="372" y2="372" stroke="url(#sword-grad)" stroke-width="10" stroke-linecap="round" />
    <line x1="120" y1="160" x2="160" y2="120" stroke="url(#sword-grad)" stroke-width="8" stroke-linecap="round" />
    <!-- Sword 2 -->
    <line x1="372" y1="140" x2="140" y2="372" stroke="url(#sword-grad)" stroke-width="10" stroke-linecap="round" />
    <line x1="352" y1="120" x2="392" y2="160" stroke="url(#sword-grad)" stroke-width="8" stroke-linecap="round" />
  </g>

  <!-- Monster Ball Outer Frame -->
  <circle cx="256" cy="256" r="116" fill="#090d16" stroke="#6366f1" stroke-width="8" />

  <!-- Ball Top Half (Red / Attack) -->
  <path d="M 144 252 A 112 112 0 0 1 368 252 Z" fill="url(#ball-top)" />

  <!-- Ball Bottom Half (White / Defense) -->
  <path d="M 144 260 A 112 112 0 0 0 368 260 Z" fill="url(#ball-bottom)" />

  <!-- Center Band -->
  <rect x="140" y="248" width="232" height="16" fill="#090d16" />

  <!-- Center Button Outer Ring -->
  <circle cx="256" cy="256" r="38" fill="#090d16" stroke="#4f46e5" stroke-width="5" />

  <!-- Center Diamond / Crystal (Status / Analytics Core) -->
  <polygon points="256,230 282,256 256,282 230,256" fill="#38bdf8" filter="url(#glow)" />
  <polygon points="256,236 276,256 256,276 236,256" fill="#ffffff" />

  <!-- Top Crown / Sparkle Accents (Champions) -->
  <circle cx="256" cy="76" r="6" fill="#38bdf8" filter="url(#glow)" />
  <circle cx="204" cy="92" r="4" fill="#818cf8" />
  <circle cx="308" cy="92" r="4" fill="#818cf8" />
</svg>